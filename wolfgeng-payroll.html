<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfgeng Restaurant — Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', Arial, sans-serif;
        }

        body {
            background: #1a1710;
            background-image: radial-gradient(ellipse at top, rgba(201, 168, 76, 0.07) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            width: 700px;
            background: linear-gradient(160deg, #fdfaf4 0%, #f7f2e8 100%);
            padding: 30px 28px;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(201, 168, 76, 0.25);
            border-top: 4px solid #c9a84c;
        }

        h1 {
            text-align: center;
            margin-bottom: 4px;
            color: #1a1710;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .subtitle {
            text-align: center;
            color: #a08840;
            font-size: 12px;
            margin-bottom: 22px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            margin: 7px 0;
            font-size: 14px;
            font-family: 'Lato', sans-serif;
            border: 1px solid #d6c99a;
            border-radius: 3px;
            background: #fffdf7;
            color: #1a1710;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #c9a84c;
        }

        input::placeholder {
            color: #b0a07a;
        }

        select option {
            background: #fffdf7;
        }

        button {
            padding: 12px;
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #a08020, #c9a84c);
            color: #1a1710;
            font-size: 14px;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 10px;
            transition: filter 0.2s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 22px;
            padding: 20px;
            background: #fffdf5;
            border-left: 4px solid #c9a84c;
            border-radius: 3px;
            box-shadow: inset 0 1px 3px rgba(201, 168, 76, 0.08);
        }

        .highlight {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            color: #1a1710;
            margin-bottom: 12px;
            letter-spacing: 0.04em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        table th {
            background: linear-gradient(135deg, #1a1710, #2e2a1e);
            color: #c9a84c;
            padding: 10px 9px;
            text-align: center;
            letter-spacing: 0.08em;
            font-size: 11px;
            text-transform: uppercase;
        }

        table td {
            border: 1px solid #e0d4a8;
            padding: 9px;
            text-align: center;
            color: #2a2010;
        }

        table tr:nth-child(odd) {
            background: #faf6ec;
        }

        table tr:nth-child(even) {
            background: #fffdf7;
            font-weight: bold;
        }

        .note {
            margin-top: 14px;
            font-size: 12px;
            color: #a08840;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="title">🍽️ Wolfgeng Restaurant</h1>
        <p class="subtitle">Payroll Calculator</p>
        <input type="text" id="empName" placeholder="Employee Name">
        <input type="number" id="hours" placeholder="Hours Worked">
        <input type="number" id="rate" placeholder="Hourly Rate (₱)">
        <select id="status">
            <option value="Regular">Regular</option>
            <option value="Contractual">Contractual</option>
            <option value="Part-Time">Part-Time</option>
        </select>
        <button onclick="computePayroll()">Compute Payroll</button>
        <div class="result" id="output">
            <h2 class="highlight">Payroll Summary</h2>
        </div>
    </div>
    <script>
        function computePayroll() {
            // getElementById()
            let name = document.getElementById("empName").value;
            let hours = document.getElementById("hours").value;
            let rate = document.getElementById("rate").value;
            let status = document.getElementById("status").value;
            // Validation
            if (name == "" || hours == "" || rate == "") {
                alert("Complete all fields.");
                return;
            }
            // Payroll
            let gross = hours * rate;
            let tax = 0;
            if (gross >= 50000)
                tax = gross * .20;
            else if (gross >= 30000)
                tax = gross * .15;
            else
                tax = gross * .10;
            // Allowance
            let allowance = 0;
            if (status == "Regular")
                allowance = 3000;
            else if (status == "Contractual")
                allowance = 1500;
            else
                allowance = 500;
            let net = (gross - tax) + allowance;
            // querySelector()
            document.querySelector("#title").textContent = "Payroll Successfully Computed";
            // querySelectorAll()
            let inputs = document.querySelectorAll("input");
            inputs.forEach(function (box) {
                box.style.background = "#fffff0";
                box.style.borderColor = "#c9a84c";
            });
            // getElementsByClassName()
            let result = document.getElementsByClassName("result")[0];
            // innerHTML
            result.innerHTML = "";
            // createElement()
            let heading = document.createElement("h2");
            heading.textContent = "Employee Payroll";
            heading.setAttribute("class", "highlight");
            // appendChild()
            result.appendChild(heading);
            // create Table
            let table = document.createElement("table");
            table.innerHTML = `
        <tr>
            <th>Description</th>
            <th>Value</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>${name}</td>
        </tr>
        <tr>
            <td>Hours Worked</td>
            <td>${hours}</td>
        </tr>
        <tr>
            <td>Hourly Rate</td>
            <td>₱${Number(rate).toFixed(2)}</td>
        </tr>
        <tr>
            <td>Status</td>
            <td>${status}</td>
        </tr>
        <tr>
            <td>Gross Pay</td>
            <td>₱${gross.toFixed(2)}</td>
        </tr>
        <tr>
            <td>Tax</td>
            <td>₱${tax.toFixed(2)}</td>
        </tr>
        <tr>
            <td>Allowance</td>
            <td>₱${allowance.toFixed(2)}</td>
        </tr>
        <tr>
            <td><b>Net Pay</b></td>
            <td><b>₱${net.toFixed(2)}</b></td>
        </tr>
    `;
            result.appendChild(table);
            // getElementsByTagName()
            let cells = document.getElementsByTagName("tr");
            for (let i = 0; i < cells.length; i++) {
                if (i % 2 == 1) {
                    cells[i].style.fontWeight = "bold";
                }
            }
            // removeChild()
            let oldParagraph = document.querySelector(".note");
            if (oldParagraph != null) {
                result.removeChild(oldParagraph);
            }
            // createElement()
            let note = document.createElement("p");
            note.textContent = "Payroll generated successfully.";
            note.setAttribute("class", "note");
            result.appendChild(note);
        }
    </script>
</body>

</html>
