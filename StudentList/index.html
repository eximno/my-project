<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records &mdash; Google Sheets CRUD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <div class="container">
    <h1 class="h4 mb-0">Student Records</h1>
  </div>
</header>

<main class="container my-5">

  <div class="row g-4">

    <!-- Form -->
    <div class="col-lg-4">
      <section class="panel p-4">
        <h2 id="formTitle" class="panel-title h6">Add Record</h2>
        <form id="recordForm" novalidate>
          <input type="hidden" id="recordId" value="">

          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" required>
            <div class="invalid-feedback">Please enter a name.</div>
          </div>

          <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <input type="text" class="form-control" id="course" placeholder="e.g. BS Computer Science" required>
            <div class="invalid-feedback">Please enter a course.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" id="submitBtn" class="btn btn-app px-4">Add</button>
            <button type="button" id="cancelBtn" class="btn btn-outline-secondary d-none">Cancel</button>
          </div>

          <div id="statusMsg" class="mt-3 small text-muted"></div>
        </form>
      </section>
    </div>

    <!-- List -->
    <div class="col-lg-8">
      <section class="panel p-4">
        <h2 class="panel-title h6">All Records</h2>
        <div class="table-responsive">
          <table class="table table-app align-middle mb-0">
            <thead>
              <tr>
                <th>Name</th>
                <th>Course</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="3" class="text-center text-muted py-4">Loading records&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

  </div>
</main>

<footer class="app-footer">
  <div class="container">Student Records &middot; Timothy Delmoro &middot; BIT33</div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
